version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_lab18
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    restart: unless-stopped

  # Lab 18 RAG Pipeline (optional)
  rag:
    build: .
    container_name: rag_lab18
    depends_on:
      - qdrant
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - .:/app
      - ./reports:/app/reports
      - ./analysis:/app/analysis
    command: sleep infinity  # Keep running for manual execution

volumes:
  qdrant_storage:
    driver: local
